<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Meeting Agent | Login</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0ea5a4">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container auth-card">
    <div class="header">
      <div class="brand-badge">AI</div>
      <div>
        <h1>AI Meeting Agent</h1>
        <p class="subtitle">Sign in to manage proposals and scheduling.</p>
      </div>
    </div>

    <div class="form">
      <label class="label" for="email">Email</label>
      <input id="email" type="email" placeholder="you@company.com" autocomplete="username">
      <p class="field-error" id="email-error"></p>

      <label class="label" for="password">Password</label>
      <input id="password" type="password" placeholder="Your password" autocomplete="current-password">
      <p class="field-error" id="password-error"></p>
      <p class="field-hint" id="password-hint"></p>

      <div class="row between">
        <label class="checkbox">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>
        <a class="link subtle" href="forgot-password.html">Forgot password?</a>
      </div>

      <button class="primary" id="login-btn" onclick="login()">Sign in</button>
      <p id="auth-message" class="message"></p>

      <p class="helper">Powered by AI-driven email understanding and smart scheduling.</p>
    </div>

    <div class="section">
      <p class="muted">Don't have an account?</p>
      <a class="link" href="register.html">Create one</a>
    </div>
  </div>

  <div id="update-toast" class="update-toast">
    <span>Update available</span>
    <button id="update-btn">Refresh</button>
  </div>
  <script src="js/auth.js?v=5"></script>
  <script src="js/pwa.js?v=2"></script>
</body>
</html>
