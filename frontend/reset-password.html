<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password | AI Meeting Agent</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0ea5a4">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container auth-card">
    <div class="header">
      <div class="brand-badge">AI</div>
      <div>
        <h1>Set a new password</h1>
        <p class="subtitle">Choose a strong password to continue.</p>
      </div>
    </div>

    <div class="form">
      <label class="label" for="password">New password</label>
      <input id="password" type="password" placeholder="New password">
      <p class="field-error" id="password-error"></p>

      <label class="label" for="confirm_password">Confirm password</label>
      <input id="confirm_password" type="password" placeholder="Confirm password">
      <p class="field-error" id="confirm-password-error"></p>

      <button class="primary" id="reset-btn" onclick="resetPassword()">Update password</button>
      <p id="message" class="message"></p>
    </div>
  </div>

  <div id="update-toast" class="update-toast">
    <span>Update available</span>
    <button id="update-btn">Refresh</button>
  </div>
  <script src="js/forgot.js?v=3"></script>
  <script src="js/pwa.js?v=2"></script>
</body>
</html>
