<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password | AI Meeting Agent</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0ea5a4">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container auth-card">
    <div class="header">
      <div class="brand-badge">AI</div>
      <div>
        <h1>Reset access</h1>
        <p class="subtitle">We'll email a secure reset link if the address exists.</p>
      </div>
    </div>

    <div class="form">
      <label class="label" for="email">Email</label>
      <input id="email" type="email" placeholder="you@company.com">
      <p class="field-error" id="email-error"></p>

      <button class="primary" id="reset-link-btn" onclick="sendResetLink()">Send reset link</button>
      <p id="message" class="message"></p>
    </div>

    <div class="section">
      <a class="link" href="login.html">Back to login</a>
    </div>
  </div>

  <div id="update-toast" class="update-toast">
    <span>Update available</span>
    <button id="update-btn">Refresh</button>
  </div>
  <script src="js/forgot.js?v=2"></script>
  <script src="js/pwa.js?v=2"></script>
</body>
</html>
